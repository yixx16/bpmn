<strong>Do you approve this tweet?</strong>

<form role="form" class="form-horizontal">
    <div class="control-group">
        <label for="email" class="control-label">Email</label>
        <div class="controls">
            <input type="text" class="form-control"
                   id="email" cam-variable-name="email"
                   readonly="true"
            />
        </div>
    </div>
    <div class="control-group">
        <label for="content" class="control-label">Content</label>
        <div class="controls">
            <input type="text" class="form-control"
                   id="content" cam-variable-name="content"
                   readonly="true"
            />
        </div>
    </div>
    <div class="control-group">
        <label for="approved" class="control-label">Approve?</label>
        <div class="controls">
            <input type="checkbox" class="form-control"
                   id="approved" cam-variable-name="approved"
                   cam-variable-type="Boolean"
            />
        </div>
    </div>
    <div class="control-group">
        <label for="comments" class="control-label">Comments</label>
        <div class="controls">
            <input type="text" class="form-control"
                   id="comments" cam-variable-name="comments"
                   cam-variable-type="String"
            />
        </div>
    </div>
</form>
